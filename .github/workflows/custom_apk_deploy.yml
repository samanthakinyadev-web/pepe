name: Build and Deploy Flutter APK

on:
  push:
    branches:
      - joe # Triggers when you push to the joe branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code
        run: flutter analyze

      - name: 🧪 Run Tests
        run: flutter test

      - name: 🏗️ Build Release APK
        run: flutter build apk --release

      - name: 🔍 Extract App Version
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 📂 Prepare Deployment Files
        run: |
          mkdir deploy_folder
          cp build/app/outputs/flutter-apk/app-release.apk deploy_folder/

          mkdir deploy_folder/api
          cat <<EOF > deploy_folder/api/app-version.php
          {
            "version": "${{ env.APP_VERSION }}",
            "url": "https://elimupepe.loholearning.co.ke/app-release.apk",
            "release_notes": "Automated update to version ${{ env.APP_VERSION }}.",
            "force_update": false
          }
          EOF

      - name: 🚀 Deploy via SCP to Ubuntu Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_folder/"
          target: "/var/www/elimupepe/"
          strip_components: 1
